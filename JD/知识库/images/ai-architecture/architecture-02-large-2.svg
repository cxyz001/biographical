<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="900" height="739" viewBox="0 739 900 739"><ns0:rect x="0" y="739" width="900" height="739" fill="white" /><ns0:style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#20252b}.title{font-size:40px;font-weight:bold}.name{font-size:38px;font-weight:bold}.desc{font-size:34px}.note{font-size:34px}</ns0:style><ns0:rect x="20" y="759" width="860" height="64" rx="6" fill="#e7eff8" /><ns0:text x="40" y="802" class="title">2. 编排、检索与工具调用</ns0:text><ns0:rect x="65" y="847" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="880" class="name">LangChain / LlamaIndex</ns0:text><ns0:text x="88" y="912" class="desc">组织模型、数据与工具</ns0:text><ns0:rect x="65" y="946" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="979" class="name">RAG 检索链路</ns0:text><ns0:text x="88" y="1011" class="desc">Embedding → 向量检索 → 重排序</ns0:text><ns0:rect x="65" y="1045" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="1078" class="name">向量库</ns0:text><ns0:text x="88" y="1110" class="desc">Milvus / PGVector</ns0:text><ns0:rect x="65" y="1144" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="1177" class="name">Agent 工具调用</ns0:text><ns0:text x="88" y="1209" class="desc">业务 API / 代码沙箱 / MCP</ns0:text><ns0:rect x="65" y="1243" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="1276" class="name">记忆管理</ns0:text><ns0:text x="88" y="1308" class="desc">保存任务上下文与历史信息</ns0:text><ns0:rect x="65" y="1342" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="1375" class="name">Redis 缓存</ns0:text><ns0:text x="88" y="1407" class="desc">会话缓存 / 结果去重缓存</ns0:text><ns0:text x="42" y="1449" class="note">编排框架连接 RAG、Agent 与记忆管理。</ns0:text></ns0:svg>