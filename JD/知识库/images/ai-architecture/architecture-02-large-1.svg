<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="900" height="739" viewBox="0 0 900 739"><ns0:rect x="0" y="0" width="900" height="739" fill="white" /><ns0:style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#20252b}.title{font-size:40px;font-weight:bold}.name{font-size:38px;font-weight:bold}.desc{font-size:34px}.note{font-size:34px}</ns0:style><ns0:rect x="20" y="20" width="860" height="64" rx="6" fill="#e7eff8" /><ns0:text x="40" y="63" class="title">1. 开发基础与接口服务</ns0:text><ns0:rect x="65" y="108" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="141" class="name">Python</ns0:text><ns0:text x="88" y="173" class="desc">主力开发语言</ns0:text><ns0:rect x="65" y="207" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="240" class="name">Pandas / NumPy</ns0:text><ns0:text x="88" y="272" class="desc">数据清洗与计算</ns0:text><ns0:rect x="65" y="306" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="339" class="name">模型 SDK</ns0:text><ns0:text x="88" y="371" class="desc">OpenAI / 通义 / DeepSeek</ns0:text><ns0:rect x="65" y="405" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="438" class="name">FastAPI / Flask</ns0:text><ns0:text x="88" y="470" class="desc">封装模型与业务接口</ns0:text><ns0:rect x="65" y="504" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="537" class="name">SSE / WebSocket</ns0:text><ns0:text x="88" y="569" class="desc">流式输出 → 前端逐字显示</ns0:text><ns0:rect x="65" y="603" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf" /><ns0:text x="88" y="636" class="name">Java / Go 业务系统</ns0:text><ns0:text x="88" y="668" class="desc">通过 HTTP 或 MQ 对接接口</ns0:text><ns0:text x="42" y="710" class="note">Python 支撑数据处理、SDK 调用和接口服务。</ns0:text></ns0:svg>