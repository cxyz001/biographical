<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2138" viewBox="0 0 900 2138" role="img" aria-label="技术栈关联图：开发、编排和部署三部分"><rect width="900" height="2138" fill="white"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#20252b}.title{font-size:30px;font-weight:bold}.name{font-size:27px;font-weight:bold}.desc{font-size:24px}.note{font-size:24px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#536471" stroke-width="2"/></marker></defs><rect x="20" y="20" width="860" height="64" rx="6" fill="#e7eff8"/><text x="40" y="63" class="title">1. 开发基础与接口服务</text><rect x="65" y="108" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="141" class="name">Python</text><text x="88" y="173" class="desc">主力开发语言</text><rect x="65" y="207" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="240" class="name">Pandas / NumPy</text><text x="88" y="272" class="desc">数据清洗与计算</text><rect x="65" y="306" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="339" class="name">模型 SDK</text><text x="88" y="371" class="desc">OpenAI / 通义 / DeepSeek</text><rect x="65" y="405" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="438" class="name">FastAPI / Flask</text><text x="88" y="470" class="desc">封装模型与业务接口</text><rect x="65" y="504" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="537" class="name">SSE / WebSocket</text><text x="88" y="569" class="desc">流式输出 → 前端逐字显示</text><rect x="65" y="603" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="636" class="name">Java / Go 业务系统</text><text x="88" y="668" class="desc">通过 HTTP 或 MQ 对接接口</text><text x="42" y="710" class="note">Python 支撑数据处理、SDK 调用和接口服务。</text><rect x="20" y="759" width="860" height="64" rx="6" fill="#e7eff8"/><text x="40" y="802" class="title">2. 编排、检索与工具调用</text><rect x="65" y="847" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="880" class="name">LangChain / LlamaIndex</text><text x="88" y="912" class="desc">组织模型、数据与工具</text><rect x="65" y="946" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="979" class="name">RAG 检索链路</text><text x="88" y="1011" class="desc">Embedding → 向量检索 → 重排序</text><rect x="65" y="1045" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="1078" class="name">向量库</text><text x="88" y="1110" class="desc">Milvus / PGVector</text><rect x="65" y="1144" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="1177" class="name">Agent 工具调用</text><text x="88" y="1209" class="desc">业务 API / 代码沙箱 / MCP</text><rect x="65" y="1243" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="1276" class="name">记忆管理</text><text x="88" y="1308" class="desc">保存任务上下文与历史信息</text><rect x="65" y="1342" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="1375" class="name">Redis 缓存</text><text x="88" y="1407" class="desc">会话缓存 / 结果去重缓存</text><text x="42" y="1449" class="note">编排框架连接 RAG、Agent 与记忆管理。</text><rect x="20" y="1498" width="860" height="64" rx="6" fill="#e7eff8"/><text x="40" y="1541" class="title">3. 私有化部署与运行监控</text><rect x="65" y="1586" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="1619" class="name">本地模型</text><text x="88" y="1651" class="desc">vLLM / llama.cpp</text><rect x="65" y="1685" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="1718" class="name">向量库与应用服务</text><text x="88" y="1750" class="desc">与本地模型一起部署</text><rect x="65" y="1784" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="1817" class="name">Docker</text><text x="88" y="1849" class="desc">打包应用与运行环境</text><rect x="65" y="1883" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="1916" class="name">Kubernetes</text><text x="88" y="1948" class="desc">容器管理与 GPU 调度</text><rect x="65" y="1982" width="770" height="82" rx="5" fill="#f7f9fc" stroke="#9caebf"/><text x="88" y="2015" class="name">Prometheus / Grafana</text><text x="88" y="2047" class="desc">采集指标与展示监控看板</text><text x="42" y="2089" class="note">本地模型 / 向量库 → Docker → K8s → 监控。</text></svg>